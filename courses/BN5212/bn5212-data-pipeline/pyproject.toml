[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bn5212-data-pipeline"
version = "1.0.0"
description = "Configurable MIMIC-IV and MIMIC-CXR cohort and data loading pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "Pillow>=10.4,<13", "pydicom>=3.0,<4", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
