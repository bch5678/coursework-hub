name: BN5212 synthetic data tests

on:
  push:
    branches: [main]
    paths:
      - 'courses/BN5212/bn5212-data-pipeline/**'
      - '.github/workflows/bn5212-tests.yml'
  pull_request:
    paths:
      - 'courses/BN5212/bn5212-data-pipeline/**'
      - '.github/workflows/bn5212-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: courses/BN5212/bn5212-data-pipeline
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: courses/BN5212/bn5212-data-pipeline/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test using synthetic data only
        run: python -m pytest -q
      - name: Check Bash entry points
        run: bash -n run_pipeline.sh setup_env.sh
