name: BN5212 training framework tests

on:
  push:
    branches: [main]
    paths:
      - 'courses/BN5212/bn5212-training/**'
      - 'courses/BN5212/bn5212-data-pipeline/**'
      - '.github/workflows/bn5212-training-tests.yml'
  pull_request:
    paths:
      - 'courses/BN5212/bn5212-training/**'
      - 'courses/BN5212/bn5212-data-pipeline/**'
      - '.github/workflows/bn5212-training-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: courses/BN5212/bn5212-training
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: courses/BN5212/bn5212-training/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      # Installed so the prediction hand-off test runs instead of skipping.
      # It is not a runtime dependency of this project.
      - name: Install the benchmark project for the contract test
        run: python -m pip install -e ../benchmark-evaluation
      - name: Test using synthetic data only
        run: python -m pytest -q
